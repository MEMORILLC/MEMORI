name: Deploy SvelteKit site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install webp tools
        run: sudo apt-get update && sudo apt-get install webp -y

      - name: Install dependencies
        run: npm ci

      - name: Run Code Linter
        run: npm run lint

      - name: Run Svelte Code and TypeScript Checks
        run: npm run check

      - name: Build
        run: npm run build

      - name: Convert build images to WebP
        run: |
          echo "Starting WebP conversion in the build directory..."
          # Locates and loops through all png, jpg, and jpeg assets inside SvelteKit's static output folder
          find ./build -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) | while read -r img; do
            echo "Converting: $img"
            cwebp -q 85 "$img" -o "${img%.*}.webp"
            rm "$img" # Deletes original asset so you don't host duplicates or heavy files
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build # Uses SvelteKit's default static adapter output directory

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
